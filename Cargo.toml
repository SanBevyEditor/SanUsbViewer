[package]
name = "san-usb-viewer"
version = "0.2.0"
edition = "2024"
description = "Explorateur USB natif : topologie, vitesses négociées et diagnostic des connexions"
license = "MIT"
repository = "https://github.com/SanBevyEditor/SanUsbViewer"

[package.metadata.san]
origin = "https://www.youtube.com/watch?v=xk6GxQEmkus"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
nusb = "0.2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
unicode-bidi = "0.3"

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Usb", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
